name: Build

# Roda em todo push e pull request para as branches principais.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Baixa o codigo do repositorio para a maquina do GitHub
      - name: Baixar o codigo
        uses: actions/checkout@v7

      # Instala o Java. O cache do Maven evita rebaixar as dependencias
      # (JavaFX, H2, JUnit) a cada execucao.
      - name: Instalar JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # Compila e roda os testes. Nao abre a aplicacao, entao nao precisa
      # de interface grafica na maquina do CI.
      - name: Compilar e testar
        run: mvn --batch-mode clean verify
