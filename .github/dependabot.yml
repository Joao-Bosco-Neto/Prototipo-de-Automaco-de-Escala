# Dependabot: abre PR automaticamente quando sai versao nova de alguma
# dependencia ou action. Nao precisa de chave nem de configuracao extra.
version: 2

updates:
  # Dependencias Java do pom.xml
  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 5
    target-branch: develop
    commit-message:
      prefix: "chore(deps)"
    labels:
      - seguranca
      - setup

  # As proprias actions usadas no CI (checkout, setup-java)
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    target-branch: develop
    commit-message:
      prefix: "chore(ci)"
    labels:
      - seguranca
      - setup
